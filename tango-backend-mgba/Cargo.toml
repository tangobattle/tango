[package]
name = "tango-backend-mgba"
version = "0.1.0"
edition = "2021"

# The mgba backend for tango-match: a pair of emulated GBAs on an
# emulated link cable. Kept out of tango-match so the seam depends on no
# emulator, and shared by every GBA game rather than copied into each.

[dependencies]
tango-match = { path = "../tango-match" }
mgba.workspace = true
mgba-rollback.workspace = true
getgud.workspace = true
thiserror.workspace = true
bytemuck.workspace = true
log.workspace = true
serde.workspace = true
serde_repr = "0.1"

[lints]
workspace = true
