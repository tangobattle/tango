[package]
name = "tango-gamesupport-common-dataview"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

# The save/ROM parsing substrate (formerly the public tango-dataview
# crate): the traits every game's dataview crate implements against,
# plus the shared derived views. Headless-safe — no UI toolkit anywhere
# below this crate.

[dependencies]
tango-gamesupport = { path = "../tango-gamesupport" }
bytemuck = { workspace = true, features = ["derive", "const_zeroed"] }
byteorder.workspace = true
c2rust-bitfields.workspace = true
image.workspace = true
itertools.workspace = true
ndarray.workspace = true
num-derive.workspace = true
num-traits.workspace = true
patricia_tree = "0.5"
thiserror.workspace = true

[lints]
workspace = true
