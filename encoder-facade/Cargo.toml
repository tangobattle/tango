[package]
name = "encoder-facade"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Video/audio encoding behind one API, with two backends (ffmpeg subprocesses, WebCodecs) feeding one set of Rust muxers"

[dependencies]
thiserror.workspace = true
log.workspace = true
# The muxers. Both are pure Rust, so the same muxing code compiles for
# wasm32 (where the WebCodecs backend needs it) as for native.
#   mkv-element: the typed Matroska element tree — Chapters, Cues,
#                Colour and CodecDelay are all first-class, so nothing
#                the exporter needs has to be hand-assembled.
#   mp4-atom:    typed ISOBMFF atoms. Sample tables are ours to build,
#                but every box we need exists (avcC, esds, colr, elst)
#                and `Any::Unknown` carries the one box it doesn't
#                model (Nero `chpl` chapters). It also reads the
#                fragmented MP4 the ffmpeg backend gets its packets
#                back from, so that path needs no parser of its own.
mkv-element = "0.4"
mp4-atom = "0.14"
# mkv-element's binary elements are `Bytes`, and both muxers encode
# through `BufMut`.
bytes = "1"

# The WebCodecs backend. Bindings are hand-rolled rather than web-sys's:
# web-sys gates WebCodecs behind the `web_sys_unstable_apis` cfg, a
# global RUSTFLAGS knob a downstream build would have to thread through
# its own toolchain and CI.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[dev-dependencies]
# An independent reader for the mux tests: our Matroska output has to
# satisfy a demuxer nobody here wrote.
matroska-demuxer = "0.8"

[lints]
workspace = true
