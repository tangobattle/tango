[package]
name = "tango-gamesupport-bn1-dataview"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

# The game's save/ROM dataview: the parsers and asset decoders behind
# `tango-gamesupport-bn1`'s Game registrations. Headless-safe — no UI
# toolkit anywhere below this crate.

[dependencies]
tango-gamesupport-common-dataview = { path = "../tango-gamesupport-common-dataview" }
image = { workspace = true, features = ["png"] }
bytemuck = { workspace = true, features = ["derive", "const_zeroed", "min_const_generics"] }
num-traits.workspace = true

[lints]
workspace = true
