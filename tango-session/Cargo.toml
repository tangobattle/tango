[package]
name = "tango-session"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
publish = false

# What the replay exporter needs — the half of this crate that builds
# for the browser as well as the desktop (see the crate docs).
[dependencies]
async-trait.workspace = true
bytemuck.workspace = true
chrono = "0.4"
# One data-channel API over libdatachannel natively and the browser's
# own WebRTC on wasm.
datachannel-wrapper = { git = "https://github.com/tangobattle/datachannel-wrapper" }
futures.workspace = true
log.workspace = true
mgba.workspace = true
rand.workspace = true
rand_pcg.workspace = true
rennet.workspace = true
tango-gamesupport = { path = "../tango-gamesupport" }
tango-match = { path = "../tango-match" }
tango-match-mgba = { path = "../tango-match-mgba" }
tango-signaling = { git = "https://github.com/tangobattle/tango-signaling" }
tango-net-protocol = { path = "../tango-net-protocol" }
tango-replay = { path = "../tango-replay" }
thiserror.workspace = true
# Only the parts of tokio that need no runtime under them: the sync
# primitives (which are plain futures) and the `select!`/`join!` macros.
# `time` and `rt` are native-only below — a browser has no driver for
# either, and asking for them here is what let `tokio::time` compile for
# wasm32 and then panic on `Instant::now` at run time. Now it doesn't
# compile, which is where that belongs.
tokio = { workspace = true, features = ["sync", "macros"] }
tokio-util = { workspace = true }
# `std::time::Instant` panics in a browser; this is the same API backed
# by `performance.now()` there and by std everywhere else.
web-time = "1"


# The live-session half: threads, sockets and wall clocks, none of which
# wasm32 has. Gated so a browser build doesn't drag in tokio's mio-backed
# networking, which doesn't compile there at all.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# `net` for the direct transport's UDP socket (mio-backed, so it has no
# wasm32 support at all); `rt`/`rt-multi-thread` for spawning, `time` for
# the waits a browser takes from the page instead, `io-util` for the
# replay reader.
tokio = { workspace = true, features = ["io-util", "net", "rt", "rt-multi-thread", "time"] }
tokio-util = { workspace = true, features = ["io", "rt"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The page's timers, for the netplay plumbing's waits — a browser has no
# runtime to hold tokio's.
gloo-timers = { version = "0.3", features = ["futures"] }
wasm-bindgen-futures = "0.4"

[lints]
workspace = true
