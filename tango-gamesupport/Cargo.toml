[package]
name = "tango-gamesupport"
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0-or-later"

[dependencies]
crc32fast.workspace = true
image.workspace = true
tango-dataview = { path = "../tango-dataview" }
tango-match = { path = "../tango-match" }
thiserror.workspace = true

# The save-editor UI layer (the `ui` feature). Optional so the base
# crate stays a pure detection surface: headless consumers (the pvp
# probes, engine hosts) never link a UI toolkit.
tango-ui = { path = "../tango-ui", optional = true }
tango-patch = { git = "https://github.com/tangobattle/tango-patch", features = ["package", "index"], optional = true }
iced = { workspace = true, optional = true }
iced_graphics = { workspace = true, optional = true }
iced_tiny_skia = { workspace = true, optional = true }
tiny-skia = { version = "0.11", optional = true }
sweeten = { workspace = true, optional = true }
lucide-icons = { workspace = true, optional = true }
fluent-templates = { workspace = true, optional = true }
unic-langid = { workspace = true, optional = true }
indexmap = { version = "2", optional = true }
itertools = { workspace = true, optional = true }
log = { workspace = true, optional = true }
semver = { workspace = true, optional = true }

[features]
ui = [
    "dep:tango-ui",
    "dep:tango-patch",
    "dep:iced",
    "dep:iced_graphics",
    "dep:iced_tiny_skia",
    "dep:tiny-skia",
    "dep:sweeten",
    "dep:lucide-icons",
    "dep:fluent-templates",
    "dep:unic-langid",
    "dep:indexmap",
    "dep:itertools",
    "dep:log",
    "dep:semver",
]

[lints]
workspace = true
