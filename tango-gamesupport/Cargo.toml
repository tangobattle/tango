[package]
name = "tango-gamesupport"
version = "0.1.0"
edition = "2021"
license = "LGPL-3.0-or-later"

[dependencies]
crc32fast.workspace = true
image.workspace = true
tango-dataview = { path = "../tango-dataview" }
tango-match = { path = "../tango-match" }
thiserror.workspace = true

# The save-editor embedding API (the `ui` feature): the SaveUi trait,
# its opaque envelopes, and the `Game::save_ui` slot. Shape-oblivious —
# the actual UI lives in the private tango-gamesupport-common. Off for
# headless consumers (the pvp probes, engine hosts), which then link no
# UI toolkit.
iced = { workspace = true, optional = true }
semver = { workspace = true, optional = true }
tango-patch = { git = "https://github.com/tangobattle/tango-patch", features = ["package", "index"], optional = true }
unic-langid = { workspace = true, optional = true }

[features]
ui = ["dep:iced", "dep:semver", "dep:tango-patch", "dep:unic-langid"]

[lints]
workspace = true
