[package]
name = "tango-web-demo"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
publish = false
description = "A browser host for tango-session: proves a session runs pumped from an event loop"

# wasm32-only (see src/lib.rs). Not in the workspace's default-members,
# so plain `cargo build`/`test` at the root ignores it; build it with
# the recipe in web/README.md.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mgba.workspace = true
tango-dataview = { path = "../tango-dataview" }
tango-gamesupport = { path = "../tango-gamesupport" }
tango-replay = { path = "../tango-replay" }
tango-session = { path = "../tango-session" }

# Every game, the same set the desktop app ships — the demo picks one by
# looking the loaded ROM up in this registry.
tango-gamesupport-bn1 = { path = "../gamesupport/tango-gamesupport-bn1" }
tango-gamesupport-bn2 = { path = "../gamesupport/tango-gamesupport-bn2" }
tango-gamesupport-bn3 = { path = "../gamesupport/tango-gamesupport-bn3" }
tango-gamesupport-bn4 = { path = "../gamesupport/tango-gamesupport-bn4" }
tango-gamesupport-bn5 = { path = "../gamesupport/tango-gamesupport-bn5" }
tango-gamesupport-bn6 = { path = "../gamesupport/tango-gamesupport-bn6" }
tango-gamesupport-exe45 = { path = "../gamesupport/tango-gamesupport-exe45" }

console_error_panic_hook = "0.1"
js-sys = "0.3"
log.workspace = true
wasm-bindgen = "0.2"
# The game-support crates use `rand`, whose getrandom needs to be told
# where a browser's entropy comes from. Feature unification means only
# the crate at the root of the build can say so, which is this one.
getrandom = { version = "0.2", features = ["js"] }

[lints]
workspace = true
