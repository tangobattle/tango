<!doctype html>
<meta charset="utf-8">
<title>tango-session in a browser</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 1rem;
    background: #14161a; color: #e6e6e6;
    font: 14px/1.5 ui-sans-serif, system-ui, sans-serif;
  }
  canvas {
    width: 720px; max-width: 96vw; aspect-ratio: 240 / 160;
    image-rendering: pixelated; background: #000; border-radius: 4px;
  }
  #bar { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; justify-content: center; }
  #status { opacity: 0.7; font-variant-numeric: tabular-nums; }
  kbd { background: #2a2e35; border-radius: 3px; padding: 0 4px; }
</style>

<canvas id="screen" width="240" height="160"></canvas>
<div id="bar">
  <label>ROM <input type="file" id="rom" accept=".gba,.srl,.bin"></label>
  <label>save <input type="file" id="save" accept=".sav"></label>
  <label>replay <input type="file" id="replay" accept=".tangoreplay"></label>
  <label><input type="checkbox" id="training"> training</label>
  <button id="start" disabled>Start</button>
  <button id="download-save" disabled>Download save</button>
</div>
<div id="status">pick a ROM</div>
<div style="opacity:.55">
  <kbd>←↑↓→</kbd> d-pad · <kbd>Z</kbd> A · <kbd>X</kbd> B · <kbd>A</kbd> L · <kbd>S</kbd> R ·
  <kbd>Enter</kbd> start · <kbd>Shift</kbd> select
</div>

<script type="module">
import init, { Demo } from './pkg/tango_web_demo.js';

const wasm = await init();
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');
const status = document.getElementById('status');

// One emulated frame is 1/59.727s; the sink holds ~64ms so a slow rAF
// (or a hidden tab, where rAF stops entirely) doesn't underrun it.
const FPS = 16777216 / 280896;
const SINK_TARGET_FRAMES = 3072;
// Stop feeding the encoders^Wsink past this: it's backpressure, not a
// clock. Two frames of slack above the target absorbs the phase swing
// between the pump and the audio thread without letting latency grow.
const SINK_MAX_FRAMES = SINK_TARGET_FRAMES * 2;
// Longest gap the accumulator will honour. A tab that was throttled for
// a second must not then sprint through a second of emulation.
const MAX_CATCHUP_MS = 250;
// Most frames one pump will run, so a burst can't lock up the page.
const MAX_BURST = 8;

// Audio frames one emulated frame produces, which is what the pump
// spends its deficit on. Set once the sink's rate is known.
let SAMPLES_PER_FRAME = 800;

let demo = null;
let romBytes = null, saveBytes = null, replayBytes = null;
let audio = null, sink = null, sinkQueued = 0;
let keys = 0, frames = 0, lastReport = performance.now();
let totalTicks = 0, totalPumps = 0;
// The pump's clock: emulated frames owed, accrued from elapsed wall
// time. Both tick sources (rAF, the sink's queue reports) spend from it,
// so a double-fire sees ~0 owed and does nothing.
let owed = 0, lastPump = performance.now();
// Whether a replay's keyframe pass still has work.
let prefetching = false;

// Keyboard → the session's button names; the bit values are mgba's and
// stay on the Rust side.
const BINDINGS = {
  ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
  KeyZ: 'a', KeyX: 'b', KeyA: 'l', KeyS: 'r',
  Enter: 'start', ShiftLeft: 'select', ShiftRight: 'select',
};
const BITS = Object.fromEntries(Object.entries(BINDINGS).map(([code, name]) => [code, Demo.key_bit(name)]));

// `?rom=<url>&save=<url>` loads from the server instead of the pickers
// — handy for iterating on one ROM, and what the automated check uses.
const params = new URLSearchParams(location.search);
if (params.has('training')) document.getElementById('training').checked = true;
if (params.has('rom')) {
  const fetchBytes = async (url) => new Uint8Array(await (await fetch(url)).arrayBuffer());
  romBytes = await fetchBytes(params.get('rom'));
  if (params.has('save')) saveBytes = await fetchBytes(params.get('save'));
  if (params.has('replay')) replayBytes = await fetchBytes(params.get('replay'));
  document.getElementById('start').disabled = false;
  status.textContent = 'ready';
}

const readFile = (input) =>
  input.files.length ? input.files[0].arrayBuffer().then((b) => new Uint8Array(b)) : Promise.resolve(null);

document.getElementById('rom').addEventListener('change', async (e) => {
  romBytes = await readFile(e.target);
  document.getElementById('start').disabled = !romBytes;
  status.textContent = romBytes ? 'ready' : 'pick a ROM';
});
document.getElementById('save').addEventListener('change', async (e) => {
  saveBytes = await readFile(e.target);
});
document.getElementById('replay').addEventListener('change', async (e) => {
  replayBytes = await readFile(e.target);
});

document.getElementById('start').addEventListener('click', async () => {
  // An AudioContext may only start from a user gesture — this click.
  audio = new AudioContext();
  await audio.audioWorklet.addModule('./sink-worklet.js');
  sink = new AudioWorkletNode(audio, 'tango-demo-sink', { outputChannelCount: [2] });
  sink.connect(audio.destination);
  // The worklet reports its queue depth every render quantum. That's
  // both the backpressure signal and the tick source: it keeps firing
  // when rAF doesn't — a hidden tab, an unfocused window, a browser
  // throttling animation — so the session runs at full speed whether or
  // not anyone is watching. Pumping from both sources is harmless,
  // since a full queue asks for no ticks.
  sink.port.onmessage = (e) => {
    sinkQueued = e.data;
    pump();
  };

  try {
    if (replayBytes) {
      prefetching = true;
      // Both sides run the same ROM here — a mirror match, which is what
      // a demo has; the desktop resolves each side's patched ROM from
      // its library.
      demo = Demo.boot_replay(replayBytes, romBytes, romBytes, audio.sampleRate);
    } else if (document.getElementById('training').checked) {
      // Training is a link battle against a do-nothing dummy, so it
      // needs a save to build its loadout from, and a match seed the
      // host draws (the desktop takes it from its RNG).
      if (!saveBytes) throw new Error('training needs a save');
      const seed = crypto.getRandomValues(new Uint8Array(16));
      demo = Demo.boot_training(romBytes, saveBytes, seed, audio.sampleRate, Date.now() / 1000);
    } else {
      demo = Demo.boot(romBytes, saveBytes ?? undefined, audio.sampleRate, Date.now() / 1000);
    }
  } catch (e) {
    status.textContent = `${e}`;
    return;
  }
  SAMPLES_PER_FRAME = audio.sampleRate / FPS;
  owed = 0;
  lastPump = performance.now();
  document.getElementById('download-save').disabled = false;
  status.textContent = `running ${demo.game()}`;
  requestAnimationFrame(frame);
});

document.getElementById('download-save').addEventListener('click', () => {
  const save = demo?.export_save();
  if (!save) return;
  const url = URL.createObjectURL(new Blob([save], { type: 'application/octet-stream' }));
  const a = Object.assign(document.createElement('a'), { href: url, download: 'demo.sav' });
  a.click();
  URL.revokeObjectURL(url);
});

addEventListener('keydown', (e) => {
  if (BITS[e.code]) { keys |= BITS[e.code]; demo?.set_keys(keys); e.preventDefault(); }
});
addEventListener('keyup', (e) => {
  if (BITS[e.code]) { keys &= ~BITS[e.code]; demo?.set_keys(keys); e.preventDefault(); }
});

// Diagnostics for the console: what the pump thinks is going on.
window.demoStats = () => ({
  audio: audio?.state,
  sampleRate: audio?.sampleRate,
  queued: sinkQueued,
  ticked: totalTicks,
  pumps: totalPumps,
  owed,
  perFrame: framesPerPaint.slice(),
  saveBytes: demo?.export_save()?.length ?? 0,
  playhead: demo?.playhead() ?? null,
});

// Jump a replay's playhead, for the console (and, in a real host, a
// scrub bar).
window.demoSeek = (tick) => demo?.seek(tick);

/// Run whatever wall-clock time says is owed, and hand the audio that
/// produced to the sink. This is the whole pump, and it is what a
/// desktop drive thread's accumulate-and-sleep does — minus the
/// sleeping, since the event loop is what comes back.
///
/// Time is the clock; the sink is only backpressure. Pacing off the
/// sink's queue instead makes the emulator lurch: the worklet reports
/// every 2.7ms, far more often than a frame's worth of audio drains, so
/// the deficit crosses a whole frame in bursts and the frames come out
/// 0,0,0,1,2 against a steady display.
function pump() {
  if (!demo) return;
  const now = performance.now();
  owed += (Math.min(now - lastPump, MAX_CATCHUP_MS) * FPS) / 1000;
  lastPump = now;

  let budget = Math.min(Math.floor(owed), MAX_BURST);
  // Never run ahead of what the sink can hold; the frames aren't lost,
  // they're owed, and the next pump runs them once it has drained.
  if (sinkQueued >= SINK_MAX_FRAMES) budget = 0;
  if (budget <= 0) return;

  const ran = demo.tick(budget);
  owed -= ran;
  frames += ran;
  totalTicks += ran;
  totalPumps++;
  if (ran === 0) {
    status.textContent = 'session ended';
    demo = null;
    return;
  }
  // Top the sink up to its target, not to its ceiling: every queued
  // frame is audio latency, and the surplus is safe where it is (the
  // session's own rate control holds it).
  const samples = demo.pull_audio(Math.max(0, SINK_TARGET_FRAMES - sinkQueued));
  if (samples.length) {
    sinkQueued += samples.length / 2;
    sink.port.postMessage(samples, [samples.buffer]);
  }
}

// Emulated frames run between the last few paints — the shape of the
// pacing, which an average hides.
const framesPerPaint = [];

let lastPaintTicks = 0;

function frame(now) {
  if (!demo) return;
  if (demo.is_ended()) {
    status.textContent = 'session ended';
    demo = null;
    return;
  }
  pump();
  // Only redraw when there's something new: a 120Hz display refreshes
  // twice per emulated frame, and converting + blitting the same
  // picture again costs work that shows up as hitching, not smoothness.
  if (totalTicks !== lastPaintTicks) {
    demo.present();
    // Rebuilt every frame on purpose: growing the wasm heap detaches
    // any view taken over its memory.
    const pixels = new Uint8ClampedArray(wasm.memory.buffer, demo.frame_ptr(), demo.frame_len());
    ctx.putImageData(new ImageData(pixels, Demo.screen_width(), Demo.screen_height()), 0, 0);
  }
  // Whatever the frame had left goes to the replay's background pass.
  // Small on purpose: it emulates a second pair on this same thread,
  // and a generous budget starves everything else.
  if (prefetching) prefetching = demo.prefetch(2);
  framesPerPaint.push(totalTicks - lastPaintTicks);
  lastPaintTicks = totalTicks;
  if (framesPerPaint.length > 120) framesPerPaint.shift();
  if (now - lastReport > 500) {
    const fps = (frames * 1000) / (now - lastReport);
    status.textContent = `running ${demo.game()} — ${fps.toFixed(1)} fps, ${sinkQueued} frames queued`;
    frames = 0;
    lastReport = now;
  }
  requestAnimationFrame(frame);
}
</script>
