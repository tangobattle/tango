<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <!-- `viewport-fit=cover` so the play screen can reach under a notch and
         claim it back with env(safe-area-inset-*); `user-scalable=no` because
         a double-tap on the D-pad must not zoom the page. -->
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1"
        />
        <meta name="theme-color" content="#0e1011" />
        <meta name="color-scheme" content="dark" />
        <!-- Installed to the home screen, this runs without browser chrome —
         which is most of what makes it feel like an app on a phone. -->
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta
            name="apple-mobile-web-app-status-bar-style"
            content="black-translucent"
        />
        <meta name="apple-mobile-web-app-title" content="Tango Lite" />
        <title>Tango Lite</title>
        <!-- Tango in line art: the same character as the desktop icon,
             at the weight the name promises. SVG for tabs, and a
             rasterized tile for iOS, which has neither SVG home-screen
             icons nor transparency. -->
        <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
        <link rel="manifest" href="./manifest.webmanifest" />
        <link rel="stylesheet" href="./style.css" />
    </head>

    <body>
        <script>
            // The viewport, measured rather than asked for.
            //
            // `100dvh` is supposed to be the screen in a standalone PWA
            // and on iOS it comes back short, which lands as a dead band
            // along the bottom — and, because the portrait play screen
            // is a box rotated about its top-left corner, as a band the
            // rotation can't cover either. `innerWidth`/`innerHeight`
            // are the layout viewport and are right in every mode, so
            // everything that has to fill the screen uses these.
            //
            // Deliberately not `visualViewport`: that shrinks when the
            // keyboard opens, and the app must not resize under a
            // nickname field.
            (function () {
                var root = document.documentElement;
                function measure() {
                    root.style.setProperty("--app-vw", window.innerWidth + "px");
                    root.style.setProperty("--app-vh", window.innerHeight + "px");
                }
                measure();
                addEventListener("resize", measure);
                addEventListener("orientationchange", measure);
            })();
        </script>
        <!-- Outside #main, and removed once the module is live: dioxus
             mounts by appending to its root, so a placeholder left inside
             it would still be on screen under the app. -->
        <div id="boot" class="boot">Loading Tango Lite…</div>
        <!-- dioxus-web mounts here (`#main` is its default root). -->
        <div id="main"></div>
        <script type="module">
            import init from "./tango-lite-web.js";
            await init();
            document.getElementById("boot")?.remove();

            // Registered after boot, so fetching the worker never
            // competes with fetching the ~14MB module it exists to
            // make instant next time. Failure is not worth reporting:
            // it costs offline, not the app.
            if ("serviceWorker" in navigator) {
                // The page is served from cache first, so a load that
                // happens after a deploy shows the *previous* build.
                // Left alone that is not "one stale load", it is one
                // stale load every time — close the app there and it
                // stays a version behind forever, which is exactly how
                // a fixed layout kept looking unfixed.
                //
                // A changed build changes sw.js (build.sh stamps a
                // digest into it), so the browser installs the new
                // worker, it claims this page, and the reload below
                // picks up the shell it just cached. Only when there
                // was already a controller: on a first visit claiming
                // is expected and reloading would be a wasted trip.
                if (navigator.serviceWorker.controller) {
                    var reloading = false;
                    navigator.serviceWorker.addEventListener("controllerchange", function () {
                        if (reloading) return;
                        reloading = true;
                        location.reload();
                    });
                }
                // `updateViaCache: none` so the worker script itself is
                // never answered from the HTTP cache — it is the one
                // file whose freshness the whole scheme rests on.
                navigator.serviceWorker.register("./sw.js", { updateViaCache: "none" }).catch(function () {});
            }
        </script>
    </body>
</html>
