[package]
name = "tango-gamesupport-ui"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
publish = false

# The shared save-editor UI layer: the widget/style/animation substrate the
# tango app draws with, the save-view components (folder table, navicust
# grid + editor, patch-card lists, navi strip, auto battle data) that
# per-game UI crates compose, and the `SaveUi` trait those crates implement
# so the app can dispatch to a game's own editor instead of being generic
# over every game. Knows nothing about any specific game.

[dependencies]
iced.workspace = true
iced_graphics.workspace = true
iced_tiny_skia.workspace = true
tiny-skia = "0.11"
sweeten.workspace = true
lucide-icons.workspace = true
image.workspace = true
fluent-templates.workspace = true
unic-langid.workspace = true
chrono = "0.4"
indexmap = "2"
itertools.workspace = true
log.workspace = true

tango-dataview = { path = "../tango-dataview" }
tango-savemodel = { path = "../tango-savemodel" }
tango-library = { path = "../tango-library", default-features = false }
tango-match = { path = "../tango-match" }

[lints]
workspace = true
