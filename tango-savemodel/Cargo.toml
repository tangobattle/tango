[package]
name = "tango-savemodel"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
publish = false

# One loaded save — the ROM, the parsed save, the assets derived from
# both — and the staged edits that mutate it. Extracted from the tango
# bin crate so a second frontend gets the save model and every editor's
# semantics for free, and only has to draw them.
#
# Nothing here renders. Where the old code baked UI-toolkit image handles
# alongside the model, that now belongs to the frontend, which derives
# its own art from `Loaded` and re-derives it when `edit::apply` reports
# an `Invalidation`. Builds for native AND wasm32.
[dependencies]
image.workspace = true
log.workspace = true
semver.workspace = true
tango-dataview = { path = "../tango-dataview" }
tango-gamesupport = { path = "../tango-gamesupport" }
tango-library = { path = "../tango-library", default-features = false }
tango-patch = { git = "https://github.com/tangobattle/tango-patch", features = ["package", "index"] }

[lints]
workspace = true
