[package]
name = "tango-gamesupport-bcc-ui"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

# The game's save-editor UI: its `GameSaveUi` implementation and the
# `SAVE_UI` shell static `tango-gamesupport-bcc` re-exports behind its
# `ui` feature. A crate of its own so the feature flagging lives at the
# aggregator — nothing in here is cfg'd.

[dependencies]
tango-gamesupport-common-dataview = { path = "../tango-gamesupport-common-dataview" }
tango-gamesupport-common-ui = { path = "../tango-gamesupport-common-ui" }
tango-gamesupport-bcc-dataview = { path = "../tango-gamesupport-bcc-dataview" }
iced = { workspace = true}
unic-langid = { workspace = true}
lucide-icons = { workspace = true}

[lints]
workspace = true
