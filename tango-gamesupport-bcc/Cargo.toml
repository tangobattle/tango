[package]
name = "tango-gamesupport-bcc"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

# The game's aggregator: the `Game` registrations (ROM identity,
# parsers, templates, presentation bits) plus the pvp engine support,
# re-exporting `tango-gamesupport-bcc-dataview` as `dataview` and —
# behind the `ui` feature, the one cfg point — the save-editor UI crate
# as `ui`. Headless builds (probes, engine hosts) never link a UI
# toolkit.

[dependencies]
tango-gamesupport = { path = "../tango-gamesupport" }
tango-gamesupport-bcc-dataview = { path = "../tango-gamesupport-bcc-dataview" }
tango-gamesupport-common = { path = "../tango-gamesupport-common", default-features = false }
tango-match = { path = "../tango-match" }
tango-backend-mgba = { path = "../tango-backend-mgba" }
mgba.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }

tango-gamesupport-bcc-ui = { path = "../tango-gamesupport-bcc-ui", optional = true }

[features]
ui = ["tango-gamesupport/ui", "dep:tango-gamesupport-bcc-ui"]

[lints]
workspace = true

[dev-dependencies]
unic-langid.workspace = true
# For the headless probe examples.
mgba-rollback.workspace = true
tango-replay = { path = "../tango-replay" }
env_logger = "0.9"
