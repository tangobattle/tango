[package]
name = "tango-gamesupport-exeoss"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

# Rockman.EXE Operate Shooting Star.
#
# The second DS cartridge Tango supports, and so the second game whose
# engine is melonDS rather than mgba: netplay is a pair of emulated DSes
# on emulated local wireless, primed into the game's own link battle by
# PC redirects, exactly as `tango-gamesupport-bn5ds` does it.

[features]
# Pairs with the app's UI build, switching the save editor on: the
# read-only folder viewer from `tango-gamesupport-exeoss-ui`.
ui = ["tango-gamesupport/ui", "dep:tango-gamesupport-exeoss-ui"]

[dependencies]
tango-gamesupport = { path = "../tango-gamesupport" }
tango-gamesupport-exeoss-dataview = { path = "../tango-gamesupport-exeoss-dataview" }
tango-gamesupport-common-dataview = { path = "../tango-gamesupport-common-dataview" }
tango-match = { path = "../tango-match" }
tango-backend-melonds = { path = "../tango-backend-melonds" }
log = "0.4"

tango-gamesupport-exeoss-ui = { path = "../tango-gamesupport-exeoss-ui", optional = true }

[lints]
workspace = true
