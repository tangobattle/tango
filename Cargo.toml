[workspace]
resolver = "2"
members = [
    "tango",
    "tango-gamesupport",
    "tango-library",
    # wasm32-only; deliberately absent from `default-members` below, so a
    # plain root `cargo build`/`test` skips it rather than failing to
    # link a browser app for the host.
    "tango-lite-web",
    "tango-lobby",
    "tango-net-protocol",
    "tango-match",
    "tango-backend-melonds",
    "tango-backend-mgba",
    "tango-replay",
    "tango-replay-renderer",
    "tango-session",
    "tango-ui",
]
# The per-game `tango-gamesupport-*` crates auto-join this workspace as
# path dependencies rather than being listed above. Keep a plain root
# build scoped to the app and shared infrastructure; app features pull
# in whichever game crates a build needs.
default-members = [
    "tango",
    "tango-gamesupport",
    "tango-library",
    "tango-lobby",
    "tango-net-protocol",
    "tango-match",
    "tango-backend-mgba",
    "tango-replay",
    "tango-replay-renderer",
    "tango-session",
    "tango-ui",
]
# Shared external dependency versions. Members inherit these and enable
# only the features they need. Keep this list alphabetical.
[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
bincode = "1"
bps = { git = "https://github.com/tangobattle/bps" }
bytemuck = "1"
byteorder = "1"
c2rust-bitfields = "0.22"
chrono = { version = "0.4", default-features = false }
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
datachannel-wrapper = { git = "https://github.com/tangobattle/datachannel-wrapper" }
encoder-facade = { git = "https://github.com/tangobattle/encoder-facade" }
fluent-templates = "0.14"
futures = "0.3"
gamepad-facade = { git = "https://github.com/tangobattle/gamepad-facade", default-features = false }
getgud = { git = "https://github.com/tangobattle/getgud" }
iced = { version = "0.14", features = ["tokio", "image-without-codecs", "markdown", "canvas", "advanced"] }
iced_graphics = { version = "0.14", features = ["geometry"] }
iced_tiny_skia = { version = "0.14", features = ["geometry"] }
image = { version = "0.25", default-features = false }
indexmap = "2"
itertools = "0.13"
log = "0.4"
lucide-icons = { version = "1.16", features = ["iced"] }
mailparse = "0.14"
mgba = { git = "https://github.com/tangobattle/mgba-rs" }
mgba-rollback = { git = "https://github.com/tangobattle/mgba-rollback" }
ndarray = "0.15"
num-derive = "0.4.2"
num-rational = { version = "0.4", default-features = false, features = ["std"] }
num-traits = "0.2"
prost = "0.14"
prost-build = "0.14"
rand = "0.8"
rand_pcg = { version = "0.3", features = ["serde1"] }
rennet = { git = "https://github.com/tangobattle/rennet" }
reqwest = { version = "0.11", default-features = false }
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"
sha3 = "0.10"
steamlocate = "2"
subtle = "2"
sweeten = "0.14"
tango-patch = { git = "https://github.com/tangobattle/tango-patch" }
tango-signaling = { git = "https://github.com/tangobattle/tango-signaling" }
thiserror = "1"
tiny-skia = "0.11"
tokio = "1"
tokio-util = "0.7"
unic-langid = { version = "0.9", features = ["likelysubtags"] }
walkdir = "2"
wasm-bindgen-futures = "0.4"
web-time = "1"
zip = { version = "2", default-features = false }
zstd = "0.13"

# `release` keeps Cargo's defaults (lto = false, codegen-units = 16) so
# iterative release builds and `cargo run --release` stay cheap. Shipped
# binaries use the `release-dist` profile below — the platform build scripts
# (win/macos/linux) pass `--profile release-dist`.
#
# For a CPU-bound emulator the hot Rust paths (mgba fastforwarder, getgud
# rollback, stepper) benefit measurably from cross-crate inlining. Thin LTO
# gets most of fat LTO's runtime win at a fraction of the build-time cost;
# codegen-units = 1 maximizes per-crate optimization of the tight loops.
# mgba's C side is unaffected (it's a separate cmake static lib already built
# -O3 -DNDEBUG).
[profile.release-dist]
inherits = "release"
lto = "thin"
codegen-units = 1
debug = 1

[workspace.lints.clippy]
# False positive on `GameRef` (= `&'static Game`) map keys: `Game` holds
# lazily-decoded caches (interior mutability), but its Hash/Eq go by
# static address, so keys can't destabilize.
mutable_key_type = "allow"
new_without_default = "allow"
type_complexity = "allow"
identity_op = "allow"
blocks_in_conditions = "allow"
redundant_closure = "allow"
too_many_arguments = "allow"
needless_lifetimes = "allow"
