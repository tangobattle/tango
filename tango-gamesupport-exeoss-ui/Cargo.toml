[package]
name = "tango-gamesupport-exeoss-ui"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

# The game's save-editor UI: its `GameSaveEditor` implementation and the
# `SAVE_EDITOR` shell static `tango-gamesupport-exeoss` re-exports behind
# its `ui` feature. A crate of its own so the feature flagging lives at
# the aggregator — nothing in here is cfg'd.

[dependencies]
tango-gamesupport-common-dataview = { path = "../tango-gamesupport-common-dataview" }
tango-gamesupport-common-ui = { path = "../tango-gamesupport-common-ui" }
iced = { workspace = true }
unic-langid = { workspace = true }

[lints]
workspace = true
