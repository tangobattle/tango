[package]
name = "tango"
version = "5.1.44"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
build = "build.rs"

[[bin]]
name = "tango"
path = "src/main.rs"

[build-dependencies]
# Windows-only: compiles resource.rc (taskbar icon + VERSIONINFO)
# into the exe. No-op on other targets via the cfg check in
# build.rs.
embed-resource = "1"

[dependencies]
num-traits.workspace = true
iced.workspace = true
# Drop-in replacement widgets that extend iced 0.14's stock ones.
# We use sweeten's `pick_list` for its `.disabled()` closure so the
# ROM dropdown can grey out games we don't have a ROM for instead
# of jamming a "file-x" glyph into the label string.
sweeten.workspace = true
# Used only for a tiny pre-iced adapter probe in `run_app`: we
# enumerate Backends::PRIMARY and auto-fall-back to ANGLE on
# Windows if no DX12/Vulkan adapter is present. Version pinned
# to match iced_wgpu 0.14's transitive `wgpu = "27.0"` so cargo
# can unify the crate. `default-features = false` because
# iced_wgpu already pulls in the default feature set
# (dx12/vulkan/metal/gles/wgsl); cargo unifies, so we don't need
# to re-list them here.
wgpu = { version = "27", default-features = false }
image = { workspace = true, default-features = true }
# Graphics primitives used by the desktop video renderer.
iced_graphics.workspace = true
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
open = "5"
discord-ipc = { git = "https://github.com/tangobattle/discord-ipc" }
tango-net-protocol = { path = "../tango-net-protocol" }
tango-lobby = { path = "../tango-lobby" }
# Reads packages and the index; the app never writes a package.
tango-patch = { workspace = true, features = ["package", "index"] }
tango-library = { path = "../tango-library" }
tango-match = { path = "../tango-match" }
tango-replay = { path = "../tango-replay" }
tango-replay-renderer = { path = "../tango-replay-renderer" }
tango-session = { path = "../tango-session" }
# Gamepad input. The crate is a facade over a gamepad-only SDL3 build
# natively and the browser Gamepad API on wasm; all the backend glue and
# the SDL subsystem trim live there, and tango sees only its
# backend-neutral `Button`/`Axis`/`GamepadEvent` types.
gamepad-facade = { workspace = true, default-features = true }
# Native audio output. The session side always mixes at 48 kHz; this
# boundary negotiates the current default device's format and converts
# to it, so a device swap can change sample rate without rebuilding the
# running emulator session.
cpal = "0.18"
rfd = "0.14"
arboard = { version = "3", default-features = false, features = ["image-data"] }
# Auto-generated Rust bindings for the Lucide icon font. Gives us
# `Icon::Foo`, `char::from(Icon::Foo)`, and (with the iced feature)
# `LUCIDE_FONT_BYTES` so we don't have to maintain a hand-rolled
# codepoint table or vendor the ttf ourselves.
lucide-icons.workspace = true
# Unique replay file names.
rand.workspace = true
bytemuck.workspace = true
thiserror.workspace = true
chrono = { workspace = true, default-features = true }
itertools.workspace = true
reqwest = { workspace = true, features = ["stream", "json", "native-tls"] }
tokio = { workspace = true, features = ["fs", "io-util", "time", "rt", "net", "sync", "macros"] }
tokio-util = { workspace = true, features = ["io", "rt"] }
futures.workspace = true
fluent-templates.workspace = true
unic-langid.workspace = true
# `ui` for the save-editor embedding API: the app's view plumbing
# speaks it (LoadedSave, the opaque message/state envelopes) whether or
# not a game is compiled in to implement it. The implementation — the
# private gamesupport UI layer — arrives with the game crates below,
# and the app never names it.
tango-gamesupport = { path = "../tango-gamesupport", features = ["ui"] }
tango-gamesupport-common-ui = { path = "../tango-gamesupport-common-ui" }
tango-ui = { path = "../tango-ui" }
tango-gamesupport-bcc = { path = "../tango-gamesupport-bcc", optional = true }
tango-gamesupport-bn1 = { path = "../tango-gamesupport-bn1", optional = true }
tango-gamesupport-bn2 = { path = "../tango-gamesupport-bn2", optional = true }
tango-gamesupport-bn3 = { path = "../tango-gamesupport-bn3", optional = true }
tango-gamesupport-bn4 = { path = "../tango-gamesupport-bn4", optional = true }
tango-gamesupport-bn5 = { path = "../tango-gamesupport-bn5", optional = true }
tango-gamesupport-bn5ds = { path = "../tango-gamesupport-bn5ds", optional = true }
tango-gamesupport-bn6 = { path = "../tango-gamesupport-bn6", optional = true }
tango-gamesupport-exe45 = { path = "../tango-gamesupport-exe45", optional = true }
tango-gamesupport-exeoss = { path = "../tango-gamesupport-exeoss", optional = true }
# Named directly only for `Container` and `Settings`, which the export
# dialog builds; the rendering itself is tango-replay-renderer's.
encoder-facade.workspace = true
directories-next = "2"
log.workspace = true
env_logger = "0.9"
anyhow.workspace = true
# Cross-platform native crash catcher: POSIX signal handlers on
# Linux, a Mach exception server on macOS (needed for
# EXC_BAD_ACCESS), SetUnhandledExceptionFilter + a vectored handler
# on Windows. Installed in the child UI process so segfaults from
# mgba / datachannel / wgpu C code are caught.
crash-handler = "0.6"
# Out-of-process minidump writing + IPC. The child's crash handler
# only ships the crash context over this channel; the supervisor
# writes the `.dmp` by reading the suspended child. Unifies on
# crash-context 0.6.3 with crash-handler, and self-links dbghelp on
# Windows (no extra link config).
minidumper = "0.8"
# For an async-signal-safe raw write(2) from the crash handler's
# no-server fallback path — `std::io::stderr().lock()` (a lock) and
# `format!` (an allocation) are both unusable in a signal/exception
# handler. `libc::write` maps to the CRT `_write` on Windows too.
libc = "0.2"
# Stack-allocated string for formatting the crash summary in the handler
# without heap allocation (see crash_log.rs).
arrayvec = "0.7"
indexmap.workspace = true
clap.workspace = true

[dev-dependencies]
# The app never writes a package, but its patch-scanner tests build one
# to scan.
tango-patch = { workspace = true, features = ["package", "index", "bundle"] }

[features]
default = ["gamesupport-all"]
gamesupport-bcc = ["dep:tango-gamesupport-bcc", "tango-gamesupport-bcc/ui", "tango-library/gamesupport-bcc"]
gamesupport-bn1 = ["dep:tango-gamesupport-bn1", "tango-gamesupport-bn1/ui", "tango-library/gamesupport-bn1"]
gamesupport-bn2 = ["dep:tango-gamesupport-bn2", "tango-gamesupport-bn2/ui", "tango-library/gamesupport-bn2"]
gamesupport-bn3 = ["dep:tango-gamesupport-bn3", "tango-gamesupport-bn3/ui", "tango-library/gamesupport-bn3"]
gamesupport-bn4 = ["dep:tango-gamesupport-bn4", "tango-gamesupport-bn4/ui", "tango-library/gamesupport-bn4"]
gamesupport-bn5 = ["dep:tango-gamesupport-bn5", "tango-gamesupport-bn5/ui", "tango-library/gamesupport-bn5"]
gamesupport-bn5ds = ["dep:tango-gamesupport-bn5ds", "tango-gamesupport-bn5ds/ui", "tango-library/gamesupport-bn5ds"]
gamesupport-bn6 = ["dep:tango-gamesupport-bn6", "tango-gamesupport-bn6/ui", "tango-library/gamesupport-bn6"]
gamesupport-exe45 = ["dep:tango-gamesupport-exe45", "tango-gamesupport-exe45/ui", "tango-library/gamesupport-exe45"]
gamesupport-exeoss = ["dep:tango-gamesupport-exeoss", "tango-gamesupport-exeoss/ui", "tango-library/gamesupport-exeoss"]
gamesupport-all = [
    "gamesupport-bcc",
    "gamesupport-bn1",
    "gamesupport-bn2",
    "gamesupport-bn3",
    "gamesupport-bn4",
    "gamesupport-bn5",
    "gamesupport-bn5ds",
    "gamesupport-bn6",
    "gamesupport-exe45",
    "gamesupport-exeoss",
]

[lints]
workspace = true

# Reveal-in-file-manager for the RevealPath effects (see `app::reveal_path`).
[dependencies.opener]
version = "0.8"
features = ["reveal"]

# Never used from our code: this exists only to constrain the resolver.
# cpal 0.18 takes `windows` and `windows-core` as two independent
# `>=0.61, <=0.62` dependencies, so cargo may land on a different
# generation for each — and does, since iced (via mundy) holds `windows`
# at 0.61 while `windows-core` floats up to 0.62. cpal's
# `#[windows::core::implement]` sites then expand against the 0.62
# `windows_core` while the interfaces they implement come from the 0.61
# one re-exported through `windows`, and the Windows build dies with
# "multiple different versions of crate `windows_core`". Pinning the
# range here keeps both halves on 0.61.
[target.'cfg(target_os = "windows")'.dependencies]
windows-core = "0.61"

# These optional dependencies activate the per-game editors through features;
# registration itself is owned by tango-library.
[package.metadata.cargo-machete]
ignored = [
    "tango-gamesupport-bcc", "tango-gamesupport-bn1", "tango-gamesupport-bn2",
    "tango-gamesupport-bn3", "tango-gamesupport-bn4", "tango-gamesupport-bn5",
    "tango-gamesupport-bn5ds", "tango-gamesupport-bn6", "tango-gamesupport-exe45",
    "tango-gamesupport-exeoss",
]
