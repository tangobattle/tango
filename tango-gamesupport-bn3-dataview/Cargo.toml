[package]
name = "tango-gamesupport-bn3-dataview"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

# The game's save/ROM dataview: the parsers and asset decoders behind
# `tango-gamesupport-bn3`'s Game registrations. Headless-safe — no UI
# toolkit anywhere below this crate.

[dependencies]
bitvec = "1"
tango-gamesupport-common = { path = "../tango-gamesupport-common", default-features = false }
image = { version = "0.25", default-features = false, features = ["png"] }
bytemuck = { version = "1", features = ["derive", "const_zeroed", "min_const_generics"] }
c2rust-bitfields = "0.22"
ndarray = "0.15"
num-traits = "0.2"

[lints]
workspace = true
