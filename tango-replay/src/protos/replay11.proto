syntax = "proto3";

package tango.replay.protos.replay11;

message Metadata {
  message GameInfo {
    message Patch {
      string name = 1;
      string version = 2;
    }
    string rom_family = 1;
    uint32 rom_variant = 2;
    Patch patch = 3;
    // How rom_family was simulated at recording time
    // (`Family::sim_version` in gamesupport — the same number the
    // netplay handshake pairs on). Playback requires it to equal the
    // family's current one, so a family whose engine support changes
    // incompatibly bumps this instead of the container version —
    // invalidating its own recordings and nobody else's. Recordings
    // that predate the field read back as 0, the version every family
    // started at, so they stay valid.
    uint32 sim_version = 4;
  }

  message Side {
    string nickname = 1;
    GameInfo game_info = 2;
    bool reveal_setup = 3;
    // Field 4 was this side's mTLS client-certificate fingerprint, the install
    // identity a client presented to the matchmaking server. Requiring a client
    // certificate breaks browsers, so the scheme is gone; recorders written
    // while it existed still have it on the wire, hence reserved rather than
    // reused.
    reserved 4;
    // Field 5 was an opaque session payload recorded beside this side's SRAM
    // frame — the only one ever minted said which of BN5DS's two cartridge
    // files the session played. A cartridge now carries that in its own bytes
    // (the file the game calls most recently saved), so the recorded SRAM
    // frame answers it and nothing rides alongside; reserved rather than
    // reused, since recorders written while it existed still put it on the
    // wire.
    reserved 5;
  }

  uint64 ts = 1;
  string link_code = 2;
  // Sides are stored in absolute player order (schema 0x1D and later);
  // the container's local_player_index byte says which one is the
  // recorder's. Field numbers kept from the local_side/remote_side era.
  Side p1_side = 3;
  Side p2_side = 4;
  // Field 5 was a `round` index, never populated to anything useful —
  // replays already cover all rounds of a match, so the field was
  // always zero and just confused the UI. Reserved so future schema
  // additions don't collide on the wire.
  reserved 5;
  uint32 match_type = 6;
  uint32 match_subtype = 7;
}
