[package]
name = "tango-gamesupport-bn5ds-ui"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

# The game's save-editor UI: its `GameSaveEditor` implementation and the
# `SAVE_EDITOR` shell static `tango-gamesupport-bn5ds` re-exports behind
# its `ui` feature. A crate of its own so the feature flagging lives at
# the aggregator — nothing in here is cfg'd.

[dependencies]
tango-gamesupport-common = { path = "../tango-gamesupport-common", features = ["ui"] }
tango-gamesupport-bn5ds-dataview = { path = "../tango-gamesupport-bn5ds-dataview" }
# For the session-payload surface (`GameSaveEditor::session_payload`).
tango-match = { path = "../tango-match" }
iced = { workspace = true }
# The NaviCust tab copies its grid out as an image.
image = { version = "0.25", default-features = false, features = ["png"] }
# The editor layer's dropdowns are sweeten's, which is what
# `chunky_pick_list` is typed for.
sweeten = { workspace = true }
unic-langid = { workspace = true }

[lints]
workspace = true
