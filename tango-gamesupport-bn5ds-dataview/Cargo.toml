[package]
name = "tango-gamesupport-bn5ds-dataview"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

# The game's save/ROM dataview: the parsers and asset decoders behind
# `tango-gamesupport-bn5ds`'s Game registrations. Headless-safe — no UI
# toolkit anywhere below this crate.

[dependencies]
tango-gamesupport-common = { path = "../tango-gamesupport-common", default-features = false }
# For the session-payload type ([`save::PlayedFile`]) — the trait it
# implements is the match seam's.
tango-match = { path = "../tango-match" }
image = { version = "0.25", default-features = false, features = ["png"] }
bytemuck = { version = "1", features = ["derive", "const_zeroed", "min_const_generics"] }
c2rust-bitfields = "0.22"
num-traits = "0.2"

[lints]
workspace = true
